function previewSVG(t){const colors={bearing:'#9daebf',nut:'#aebdcb',spring:'#b9c5d2',fan:'#6797b9',pcb:'#328d70',switch:'#aebdcb',relay:'#315a8b',resistor:'#d2ad79',capacitor:'#315a8b',led:'#fa5366',diode:'#aebdcb',battery:'#2c9b69',motor:'#9daebf',gear:'#9daebf',screw:'#aebdcb',plate:'#328d70',pipe:'#9eb2c6',bracket:'#9eb2c6',box:'#6797b9',cylinder:'#6797b9',sphere:'#6797b9'};const c=colors[t]||'#76a6d4';return `<svg viewBox="0 0 90 52"><defs><linearGradient id="g${t}" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#fff" stop-opacity=".45"/><stop offset="1" stop-color="${c}"/></linearGradient></defs>${t==='resistor'?`<path d="M5 27H28M62 27H85" stroke="#b9c5d2" stroke-width="3"/><rect x="27" y="16" width="36" height="22" rx="8" fill="url(#g${t})" stroke="#f5d4aa"/><path d="M36 17v20m8-20v20m8-20v20" stroke="#8d4834" stroke-width="3"/>`:t==='capacitor'?`<path d="M20 27H38m14 0h18" stroke="#cbd6e2" stroke-width="3"/><rect x="37" y="8" width="16" height="37" rx="6" fill="url(#g${t})" stroke="#8fa8c1"/><path d="M39 12h12" stroke="#e9f4ff" stroke-width="2"/>`:t==='led'?`<path d="M24 39V27h42v12" fill="${c}" stroke="#ffb4bc"/><path d="M18 39h54" stroke="#b9c5d2" stroke-width="3"/><path d="M30 25 45 8l15 17z" fill="${c}" stroke="#ffc3ca"/><path d="m60 9 8-6m-7 13 11-1" stroke="#ffb454" stroke-width="2"/>`:t==='gear'?`<circle cx="45" cy="27" r="17" fill="${c}" stroke="#e4edf7" stroke-width="2"/><circle cx="45" cy="27" r="7" fill="#1b2a3c" stroke="#d5e0ed" stroke-width="2"/>${Array.from({length:8},(_,i)=>{let a=i*Math.PI/4;return `<rect x="${41+Math.cos(a)*19}" y="${23+Math.sin(a)*19}" width="8" height="8" rx="1" fill="${c}" transform="rotate(${i*45} ${45+Math.cos(a)*19} ${27+Math.sin(a)*19})"/>`}).join('')}`:`<rect x="20" y="8" width="50" height="36" rx="${t==='sphere'?18:5}" fill="url(#g${t})" stroke="#d8e5f2" stroke-width="1.5"/><path d="M20 18h50M30 8v36" stroke="#ffffff" stroke-opacity=".3"/>`}</svg>`}
function closeSheet(){$('#sheet').classList.remove('open')}
$('#closeSheet').onclick=closeSheet;
function openProject(){const body=$('#sheetBody');$('#sheetTitle').textContent='Gestion du projet';body.innerHTML=`<p class="sub">Le projet est enregistré automatiquement sur cet appareil.</p><div class="actionrow"><button class="action primary" id="saveNow">Enregistrer maintenant</button><button class="action" id="exportProject">Exporter le projet JSON</button></div><div class="actionrow"><button class="action" id="importProject">Importer un projet</button><button class="action danger" id="newProject">Nouveau projet</button></div><input type="file" id="projectFile" accept=".json,application/json" hidden><p class="sub">Formats de travail : JSON projet, OBJ et STL pour la scène 3D, PNG pour le schéma électronique.</p>`;$('#saveNow').onclick=()=>{autosave();toast('Projet enregistré')};$('#exportProject').onclick=()=>download('structura-v3.json',JSON.stringify({version:3,scene:snapshot3(),circuit},null,2),'application/json');$('#importProject').onclick=()=>$('#projectFile').click();$('#projectFile').onchange=async e=>{try{let o=JSON.parse(await e.target.files[0].text());load3(o.scene||[]);loadCircuit(o.circuit||{parts:[],wires:[]});toast('Projet importé')}catch{toast('Fichier projet invalide')}};$('#newProject').onclick=()=>{if(confirm('Effacer la scène et le schéma actuels ?')){world.clear();circuit={parts:[],wires:[]};selected=null;drawCircuit();renderInspector();autosave()}};$('#sheet').classList.add('open')}
$('#menuBtn').onclick=openProject;$('#saveBtn').onclick=()=>{autosave();toast('Sauvegarde automatique effectuée')};
$('#viewBtn').onclick=()=>{camera.position.set(7,6,8);controls.target.set(0,1,0);controls.update()};
$('#gridBtn').onclick=()=>{gridOn=!gridOn;grid.visible=gridOn};$('#zoomBtn').onclick=()=>{camera.position.multiplyScalar(.82);controls.update()};
function download(name,data,type){const blob=new Blob([data],{type}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function openGemini(){const body=$('#sheetBody');$('#sheetTitle').textContent='Assistant Gemini';body.innerHTML=`<p class="sub">Décris ton invention. Gemini pourra analyser le projet courant et te proposer des étapes, composants et connexions.</p><div class="field"><label>Clé API Gemini</label><input id="gemKey" type="password" placeholder="Colle ta clé API Google AI Studio" value="${store.get('gemini.key')||''}"></div><div class="field"><label>Ta demande</label><textarea id="gemPrompt" rows="4" placeholder="Ex. : Aide-moi à concevoir une petite perceuse électrique alimentée par batterie…"></textarea></div><button class="action primary" id="askGemini">Analyser avec Gemini</button><div class="divider"></div><div id="gemReply" class="sub">L'assistant répondra ici. Une connexion Internet et une clé API Gemini sont nécessaires.</div>`;$('#gemKey').onchange=e=>store.set('gemini.key',e.target.value.trim());$('#askGemini').onclick=async()=>{const key=$('#gemKey').value.trim(),prompt=$('#gemPrompt').value.trim(),reply=$('#gemReply');if(!key||!prompt){toast('Ajoute la clé et ta demande');return}store.set('gemini.key',key);reply.textContent='Gemini analyse le projet…';const context=JSON.stringify({scene:snapshot3(),circuit});try{const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key='+encodeURIComponent(key),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({systemInstruction:{parts:[{text:'Tu es un ingénieur pédagogique en conception mécanique, électronique et fabrication. Réponds en français clair. Analyse les éléments du projet transmis, signale les risques électriques et mécaniques, ne prétends pas simuler physiquement ce qui ne l’est pas.'}]},contents:[{parts:[{text:'Projet actuel (JSON): '+context+'\\nDemande: '+prompt}]}]})});const j=await r.json();if(!r.ok)throw new Error(j.error?.message||'Erreur API');reply.textContent=j.candidates?.[0]?.content?.parts?.map(p=>p.text||'').join('\\n')||'Réponse vide'}catch(e){reply.textContent='Impossible de joindre Gemini : '+e.message+' Vérifie la clé API et la connexion.'}};$('#sheet').classList.add('open')}
function openWireSettings(){const body=$('#sheetBody');$('#sheetTitle').textContent='Couleurs des connexions';body.innerHTML=`<p class="sub">Choisis la couleur du prochain fil. Convention indicative : rouge pour alimentation positive, noir pour masse, bleu/vert pour signaux.</p><div class="wire-colors">${palette.map(c=>`<button class="wire-color ${c===wireColor?'active':''}" data-c="${c}" style="background:${c}"></button>`).join('')}</div><p class="sub" style="margin-top:15px">La couleur est enregistrée avec chaque connexion.</p>`;body.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{wireColor=b.dataset.c;openWireSettings()});$('#sheet').classList.add('open')}
$('#stageLabel').onclick=()=>mode==='circuit'&&openWireSettings();
function restore(){try{const p=JSON.parse(store.get('structura.v3.project')||'null');if(p){load3(p.scene||[]);loadCircuit(p.circuit||{parts:[],wires:[]});}}catch(e){console.warn('Projet sauvegardé illisible',e)}}
document.addEventListener('pointermove',e=>{if(dragCandidate&&dragOrigin&&Math.hypot(e.clientX-dragOrigin[0],e.clientY-dragOrigin[1])>9)dragMoved=true});
document.addEventListener('pointerup',e=>{
 if(!dragCandidate||!dragMoved||!e.target.closest('.stage')){dragCandidate=null;dragOrigin=null;return}
 if(mode==='3d'){
  const rect=renderer.domElement.getBoundingClientRect(),v=new THREE.Vector2((e.clientX-rect.left)/rect.width*2-1,-(e.clientY-rect.top)/rect.height*2+1),ray=new THREE.Raycaster();
  ray.setFromCamera(v,camera);const point=new THREE.Vector3();ray.ray.intersectPlane(new THREE.Plane(new THREE.Vector3(0,1,0),0),point);
  saveHist();addPart(dragCandidate,point);toast('Pièce déposée dans la scène');
 }else{
  const [x,y]=pos2(e);saveCircuitHist();const def=ctype[dragCandidate];if(def){circuit.parts.push({id:nextId++,type:dragCandidate,x,y,label:window.pendingCircuitLabel||def[1]});window.pendingCircuitLabel=null;drawCircuit();autosave();toast(def[1]+' déposé sur le schéma')}
 }
 closeSheet();dragCandidate=null;dragOrigin=null;dragMoved=false;
});

 restore();buildTools();dock();renderInspector();resize()}
init();
