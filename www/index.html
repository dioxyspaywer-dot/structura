<!doctype html><html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Structura</title>
<script type="importmap">{"imports":{"three":"./lib/three.module.min.js"}}</script>
<style>
:root{--bg:#0d1a2b;--p:#15273d;--p2:#1f3857;--ln:#2e4d73;--ink:#e8eff8;--mu:#8fa6c1;--ac:#f0a53a;--ok:#4cc9a0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
body{display:grid;grid-template-rows:auto 1fr auto;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
header{display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--p);border-bottom:1px solid var(--ln)}
header b{font-size:18px;letter-spacing:.3px;margin-right:auto}
.seg{display:flex;background:var(--bg);border-radius:14px;padding:3px}
.seg button{border:0;background:none;color:var(--mu);padding:8px 14px;border-radius:11px;font:inherit;font-weight:600}
.seg button.on{background:var(--ac);color:#1b1305}
main{position:relative;min-height:0}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#dock{display:flex;gap:8px;padding:10px;background:var(--p);border-top:1px solid var(--ln);overflow-x:auto}
.b{flex:0 0 auto;min-width:64px;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:1px solid var(--ln);background:var(--p2);color:var(--ink);border-radius:16px;font:inherit;font-size:12px;padding:6px 10px}
.b i{font-style:normal;font-size:20px;line-height:1}
.b.on{background:var(--ac);color:#1b1305;border-color:var(--ac)}
.b:active{transform:scale(.96)}
#sheet{position:fixed;left:0;right:0;bottom:0;max-height:62%;background:var(--p);border-top:1px solid var(--ln);border-radius:22px 22px 0 0;padding:12px 14px calc(16px + env(safe-area-inset-bottom));overflow:auto;transform:translateY(105%);transition:transform .22s;z-index:5;box-shadow:0 -12px 40px #0008}
#sheet.open{transform:none}
#tabs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto}
#tabs button{border:0;background:none;color:var(--mu);font:inherit;font-weight:600;padding:8px 12px;border-radius:10px;white-space:nowrap}
#tabs button.on{background:var(--p2);color:var(--ink)}
#tabs .x{margin-left:auto;color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.f{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
label{display:block;font-size:12px;color:var(--mu);margin-bottom:4px}
input[type=number],input[type=text],input[type=password]{width:100%;min-height:44px;background:var(--bg);border:1px solid var(--ln);border-radius:12px;color:var(--ink);padding:0 10px;font:inherit}
input[type=color]{width:100%;height:44px;border:1px solid var(--ln);border-radius:12px;background:var(--bg);padding:3px}
.chips{display:flex;gap:6px;overflow-x:auto;margin:10px 0 0;padding-bottom:4px}
.chips button{flex:0 0 auto;border:1px solid var(--ln);background:var(--p2);color:var(--ink);border-radius:20px;padding:7px 12px;font:inherit;font-size:13px}
.chips button.on{background:var(--ac);color:#1b1305;border-color:var(--ac)}
.row{display:flex;gap:8px;margin-bottom:6px}.row .b{flex:1;min-height:46px;flex-direction:row;gap:8px}
p.n{color:var(--mu);font-size:13px;margin:10px 0 0}
#toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:var(--ok);color:#06251b;padding:8px 16px;border-radius:20px;font-weight:600;opacity:0;transition:opacity .2s;z-index:9;pointer-events:none}
@media (orientation:landscape) and (max-height:560px){
 body{grid-template-columns:auto 1fr;grid-template-rows:auto 1fr}
 header{grid-column:1/-1}
 #dock{grid-row:2;flex-direction:column;border-top:0;border-right:1px solid var(--ln);overflow-y:auto}
 main{grid-row:2;grid-column:2}
 #sheet{left:auto;width:360px;top:56px;max-height:none;border-radius:22px 0 0 0;transform:translateX(105%)}
}
</style></head><body>
<header><b>Structura</b><div class="seg"><button data-m="3d" class="on">Structure 3D</button><button data-m="ckt">Circuit</button></div></header>
<main><canvas id="c3"></canvas><canvas id="c2" style="display:none"></canvas></main>
<nav id="dock"></nav>
<section id="sheet"><div id="tabs"></div><div id="body"></div></section>
<div id="toast"></div>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from './lib/OrbitControls.js';
import {CAT} from './catalog.js';
const $=s=>document.querySelector(s);
const st={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
const toast=t=>{const e=$('#toast');e.textContent=t;e.style.opacity=1;setTimeout(()=>e.style.opacity=0,1600)};
let mode='3d',snapOn=st.get('snap')!=='0';

/* ---------- 3D ---------- */
const r3=new THREE.WebGLRenderer({canvas:$('#c3'),antialias:true});r3.setPixelRatio(Math.min(devicePixelRatio,2));
const sc=new THREE.Scene();sc.background=new THREE.Color(0x0d1a2b);
const cam=new THREE.PerspectiveCamera(50,1,.1,500);cam.position.set(5,4,6);
const ctl=new OrbitControls(cam,$('#c3'));ctl.enableDamping=true;
sc.add(new THREE.GridHelper(20,40,0x4a6d99,0x24405f),new THREE.HemisphereLight(0xffffff,0x334455,1.1));
const dl=new THREE.DirectionalLight(0xffffff,1.6);dl.position.set(5,10,6);sc.add(dl);
const grp=new THREE.Group();sc.add(grp);
const mk={box:()=>new THREE.BoxGeometry(1,1,1),cyl:()=>new THREE.CylinderGeometry(.5,.5,1,32),sph:()=>new THREE.SphereGeometry(.5,32,16),cone:()=>new THREE.ConeGeometry(.5,1,32),beam:()=>new THREE.BoxGeometry(4,.2,.2),plate:()=>new THREE.BoxGeometry(2,.1,2),pillar:()=>new THREE.BoxGeometry(.3,3,.3)};
const names={box:'Cube',cyl:'Cylindre',sph:'Sphère',cone:'Cône',beam:'Poutre',plate:'Plaque',pillar:'Poteau'};
let sel=null,und=[];
const ser=()=>JSON.stringify(grp.children.map(m=>({t:m.userData.t,p:m.position.toArray(),s:m.scale.toArray(),r:m.rotation.y,c:'#'+m.material.color.getHexString()})));
const hist=()=>{und.push(ser());if(und.length>60)und.shift()};
function add(t,o){const m=new THREE.Mesh(mk[t](),new THREE.MeshStandardMaterial({color:o?o.c:'#5aa9e6',roughness:.5,metalness:.2}));m.userData.t=t;
 if(o){m.position.fromArray(o.p);m.scale.fromArray(o.s);m.rotation.y=o.r}else m.position.set(0,t==='pillar'?1.5:t==='beam'?.1:t==='plate'?.05:.5,0);grp.add(m);return m}
function pick(m){if(sel)sel.material.emissive.setHex(0);sel=m;if(m)m.material.emissive.setHex(0x2a3b55);if(cur==='props')tab('props')}
function loadS(j){pick(null);grp.clear();JSON.parse(j).forEach(o=>add(o.t,o))}
const sn=v=>snapOn?Math.round(v/.25)*.25:v;
let down=null;const rc=new THREE.Raycaster();
$('#c3').addEventListener('pointerdown',e=>down=[e.clientX,e.clientY]);
$('#c3').addEventListener('pointerup',e=>{if(!down||Math.hypot(e.clientX-down[0],e.clientY-down[1])>6)return;
 const b=e.target.getBoundingClientRect();rc.setFromCamera(new THREE.Vector2((e.clientX-b.left)/b.width*2-1,-(e.clientY-b.top)/b.height*2+1),cam);
 const h=rc.intersectObjects(grp.children)[0];pick(h?h.object:null)});
function tris(){grp.updateMatrixWorld(true);const o=[];grp.children.forEach(m=>{const g=m.geometry,p=g.attributes.position,ix=g.index,v=i=>new THREE.Vector3().fromBufferAttribute(p,i).applyMatrix4(m.matrixWorld),n=ix?ix.count:p.count;
 for(let i=0;i<n;i+=3)o.push((ix?[ix.getX(i),ix.getX(i+1),ix.getX(i+2)]:[i,i+1,i+2]).map(v))});return o}
const stl=()=>'solid structura\n'+tris().map(t=>{const n=new THREE.Vector3().subVectors(t[1],t[0]).cross(new THREE.Vector3().subVectors(t[2],t[0])).normalize();return`facet normal ${n.x} ${n.y} ${n.z}\nouter loop\n${t.map(v=>`vertex ${v.x} ${v.y} ${v.z}`).join('\n')}\nendloop\nendfacet`}).join('\n')+'\nendsolid structura';
const obj=()=>{let s='o structura\n',k=1;tris().forEach(t=>{t.forEach(v=>s+=`v ${v.x} ${v.y} ${v.z}\n`);s+=`f ${k} ${k+1} ${k+2}\n`;k+=3});return s};

/* ---------- Circuit ---------- */
const cv=$('#c2'),cx=cv.getContext('2d');
const T={R:'Résistance',C:'Condensateur',L:'Bobine',D:'Diode',LED:'LED',Q:'Transistor',B:'Pile',S:'Interrupteur',IC:'Circuit intégré',MCU:'Microcontrôleur',GND:'Masse'};
let parts=[],wires=[],ctool='place',ctype={t:'Résistance 1kΩ',k:'R'},link=null,cund=[],drag=null,pid=1;
const cser=()=>JSON.stringify({parts,wires,pid});
const chist=()=>{cund.push(cser());if(cund.length>60)cund.shift()};
const cload=j=>{const o=JSON.parse(j);parts=o.parts;wires=o.wires;pid=o.pid;draw()};
function draw(){const w=cv.clientWidth,h=cv.clientHeight;cx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);cx.fillStyle='#0d1a2b';cx.fillRect(0,0,w,h);
 cx.fillStyle='#24405f';for(let x=0;x<w;x+=20)for(let y=0;y<h;y+=20)cx.fillRect(x,y,1.5,1.5);
 const g=i=>parts.find(p=>p.id===i);cx.strokeStyle='#f0a53a';cx.lineWidth=3;cx.lineJoin='round';
 wires.forEach(([a,b])=>{a=g(a);b=g(b);if(!a||!b)return;const x1=a.x+32,x2=b.x-32,m=(x1+x2)/2;cx.beginPath();cx.moveTo(x1,a.y);cx.lineTo(m,a.y);cx.lineTo(m,b.y);cx.lineTo(x2,b.y);cx.stroke()});
 parts.forEach(p=>{cx.fillStyle=p.id===link?'#f0a53a':'#1f3857';cx.strokeStyle=p.id===link?'#fff':'#5aa9e6';cx.lineWidth=2;cx.beginPath();cx.roundRect(p.x-32,p.y-20,64,40,10);cx.fill();cx.stroke();
 cx.fillStyle=p.id===link?'#1b1305':'#e8eff8';cx.font='700 15px system-ui';cx.textAlign='center';cx.textBaseline='middle';cx.fillText(p.k||'?',p.x,p.y);
 cx.fillStyle='#8fa6c1';cx.font='11px system-ui';cx.fillText((p.t||'').slice(0,20),p.x,p.y+34);cx.fillStyle='#f0a53a';[-32,32].forEach(d=>{cx.beginPath();cx.arc(p.x+d,p.y,4,0,7);cx.fill()})})}
const hit=(x,y)=>[...parts].reverse().find(p=>Math.abs(x-p.x)<36&&Math.abs(y-p.y)<24);
const pos=e=>{const b=cv.getBoundingClientRect();return[e.clientX-b.left,e.clientY-b.top]};
cv.addEventListener('pointerdown',e=>{const[x,y]=pos(e),h=hit(x,y);
 if(ctool==='place'){if(!h){chist();parts.push({id:pid++,t:ctype.t,k:ctype.k,x:Math.round(x/20)*20,y:Math.round(y/20)*20})}}
 else if(ctool==='wire'&&h){if(!link)link=h.id;else{if(link!==h.id){chist();wires.push([link,h.id])}link=null}}
 else if(ctool==='move'&&h){chist();drag=h}
 else if(ctool==='del'&&h){chist();parts=parts.filter(p=>p!==h);wires=wires.filter(w=>!w.includes(h.id))}
 draw()});
cv.addEventListener('pointermove',e=>{if(drag){const[x,y]=pos(e);drag.x=Math.round(x/20)*20;drag.y=Math.round(y/20)*20;draw()}});
addEventListener('pointerup',()=>drag=null);

/* ---------- Interface ---------- */
function resize(){const m=$('main'),w=m.clientWidth,h=m.clientHeight;r3.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix();cv.width=w*devicePixelRatio;cv.height=h*devicePixelRatio;draw()}
new ResizeObserver(resize).observe($('main'));
r3.setAnimationLoop(()=>{if(mode==='3d'){ctl.update();r3.render(sc,cam)}});
const btn=(i,t,f,on)=>{const b=document.createElement('button');b.className='b'+(on?' on':'');b.innerHTML=`<i>${i}</i>${t}`;b.onclick=f;return b};
function dock(){const d=$('#dock');d.innerHTML='';
 if(mode==='3d'){[['＋','Ajouter',()=>tab('add')],['⚙','Propriétés',()=>tab('props')],['↶','Annuler',undo],['⧉','Dupliquer',dup],['🗑','Supprimer',del],['⌂','Vue',()=>{cam.position.set(5,4,6);ctl.target.set(0,0,0)}],['☰','Menu',()=>tab('file')]].forEach(a=>d.append(btn(...a)))}
 else{[['▣','Composants',()=>tab('parts')],['✛','Placer',()=>ct('place'),ctool==='place'],['⌁','Câbler',()=>ct('wire'),ctool==='wire'],['✥','Déplacer',()=>ct('move'),ctool==='move'],['✕','Effacer',()=>ct('del'),ctool==='del'],['↶','Annuler',undo],['☰','Menu',()=>tab('file')]].forEach(a=>d.append(btn(...a)))}}
const ct=t=>{ctool=t;link=null;dock();draw()};
function undo(){if(mode==='3d'){if(und.length)loadS(und.pop());else toast('Rien à annuler')}else{if(cund.length)cload(cund.pop());else toast('Rien à annuler')}}
function dup(){if(!sel)return toast('Touche un objet d’abord');hist();const m=add(sel.userData.t,{p:sel.position.toArray(),s:sel.scale.toArray(),r:sel.rotation.y,c:'#'+sel.material.color.getHexString()});m.position.x+=.5;pick(m)}
function del(){if(!sel)return toast('Touche un objet d’abord');hist();grp.remove(sel);pick(null)}
let cur='';
const TABS3={add:'Ajouter',props:'Propriétés',file:'Fichier',set:'Réglages'},TABSC={parts:'Composants',file:'Fichier',set:'Réglages'};
function tab(k){cur=k;const T_=mode==='3d'?TABS3:TABSC;$('#sheet').classList.add('open');
 $('#tabs').innerHTML=Object.entries(T_).map(([a,b])=>`<button data-k="${a}" class="${a===k?'on':''}">${b}</button>`).join('')+'<button class="x" data-k="">✕</button>';
 $('#tabs').onclick=e=>{const k=e.target.dataset.k;if(k===undefined)return;k?tab(k):close()};
 const B=$('#body');B.innerHTML='';
 if(k==='add'){B.innerHTML='<div class="grid"></div>';Object.keys(mk).forEach(t=>$('.grid').append(btn('◆',names[t],()=>{hist();pick(add(t));toast(names[t]+' ajouté')})))}
 if(k==='parts'){const lib=()=>{try{return JSON.parse(st.get('lib')||'{}')}catch(e){return{}}};
  const cats=()=>CAT.concat(Object.entries(lib()).map(([n,i])=>({id:'X',name:n,sym:'X',items:i})));let pc=-1;
  B.innerHTML='<div class="row"></div><input type="text" id="q" placeholder="Rechercher dans '+cats().reduce((a,c)=>a+c.items.length,0)+' composants"><div class="chips" id="ch"></div><div class="grid" id="pl" style="margin-top:10px"></div><p class="n" id="mo"></p>';
  const R=$('.row');R.append(btn('＋','Créer un composant',()=>{const n=prompt('Nom du composant');if(n){const l=lib();(l['Mes composants']=l['Mes composants']||[]).push(n);st.set('lib',JSON.stringify(l));tab('parts')}}));
  const fi=document.createElement('input');fi.type='file';fi.accept='.json';fi.hidden=true;fi.onchange=async()=>{try{const j=JSON.parse(await fi.files[0].text()),l=lib();for(const[n,i]of Object.entries(Array.isArray(j)?{'Importés':j}:j))l[n]=[...(l[n]||[]),...i.map(String)];st.set('lib',JSON.stringify(l));toast('Catalogue importé');tab('parts')}catch(e){toast('Fichier JSON invalide')}};
  R.append(btn('⬆','Importer un catalogue JSON',()=>fi.click()),fi);
  const show=()=>{const q=$('#q').value.toLowerCase(),C=cats(),L=[];C.forEach((c,i)=>{if(pc<0||pc===i)c.items.forEach(n=>{if(!q||(n+' '+c.name).toLowerCase().includes(q))L.push([c,n])})});
   $('#pl').innerHTML='';L.slice(0,90).forEach(([c,n])=>$('#pl').append(btn(c.sym,n,()=>{ctype={t:n,k:c.sym};ctool='place';dock();close();toast(n+' : touche le plan')},ctype.t===n)));
   $('#mo').textContent=L.length>90?L.length+' résultats : affine la recherche ou choisis une catégorie.':L.length?'':'Aucun résultat. Tu peux créer ce composant.'};
  const ch=()=>{$('#ch').innerHTML='';[['Tous',-1],...cats().map((c,i)=>[c.name,i])].forEach(([n,i])=>{const b=document.createElement('button');b.textContent=n;b.className=pc===i?'on':'';b.onclick=()=>{pc=i;ch();show()};$('#ch').append(b)})};
  $('#q').oninput=show;ch();show()}
 if(k==='props'){if(!sel){B.innerHTML='<p class="n">Touche un objet dans la vue 3D pour modifier ses dimensions.</p>';return}
  const F=(l,v,fn)=>{const d=document.createElement('div');d.innerHTML=`<label>${l}</label><input type="number" step=".25" value="${+v.toFixed(2)}">`;const i=d.querySelector('input');i.onfocus=hist;i.oninput=()=>{if(i.value!=='')fn(sn(+i.value))};return d};
  const row=(a)=>{const r=document.createElement('div');r.className='f';a.forEach(x=>r.append(x));B.append(r)};
  row([F('Position X',sel.position.x,v=>sel.position.x=v),F('Hauteur Y',sel.position.y,v=>sel.position.y=v),F('Position Z',sel.position.z,v=>sel.position.z=v)]);
  row([F('Largeur',sel.scale.x,v=>sel.scale.x=Math.max(.05,v)),F('Hauteur',sel.scale.y,v=>sel.scale.y=Math.max(.05,v)),F('Profondeur',sel.scale.z,v=>sel.scale.z=Math.max(.05,v))]);
  const r=document.createElement('div');r.className='f';r.innerHTML='<div><label>Rotation (°)</label><input type="number" step="15" value="'+Math.round(sel.rotation.y*57.3)+'"></div><div><label>Couleur</label><input type="color" value="#'+sel.material.color.getHexString()+'"></div>';
  const [ri,ci]=r.querySelectorAll('input');ri.onfocus=ci.onfocus=hist;ri.oninput=()=>sel.rotation.y=ri.value*Math.PI/180;ci.oninput=()=>sel.material.color.set(ci.value);B.append(r)}
 if(k==='file'){B.innerHTML='<div class="grid"></div>';const G=$('.grid');
  const A=[['💾','Enregistrer',()=>{st.set('p_'+mode,mode==='3d'?ser():cser());toast('Projet enregistré')}],['📂','Charger',()=>{const j=st.get('p_'+mode);if(!j)return toast('Aucun projet enregistré');mode==='3d'?loadS(j):cload(j);toast('Projet chargé')}],
   ['✉','Envoyer par e-mail',()=>{location.href='mailto:?subject='+encodeURIComponent('Projet Structura')+'&body='+encodeURIComponent((mode==='3d'?ser():cser()).slice(0,1500))}],
   ['🗒','Nouveau',()=>{if(mode==='3d'){hist();pick(null);grp.clear()}else{chist();parts=[];wires=[];draw()}}]];
  if(mode==='3d')A.push(['⬇','Export STL',()=>save('structura.stl',stl(),'model/stl')],['⬇','Export OBJ',()=>save('structura.obj',obj(),'text/plain')],['⬇','Projet JSON',()=>save('structura.json',ser(),'application/json')]);
  else A.push(['⬇','Export PNG',()=>{cv.toBlob(b=>saveB('circuit.png',b))}],['⬇','Projet JSON',()=>save('circuit.json',cser(),'application/json')]);
  A.forEach(a=>G.append(btn(...a)))}
 if(k==='set'){B.innerHTML=`<label>Identifiant client Gmail (OAuth)</label><input type="text" id="gid" value="${st.get('gid')||''}"><label style="margin-top:10px">Clé API Gmail</label><input type="password" id="gk" value="${st.get('gk')||''}">
  <div class="grid" style="margin-top:12px"></div><p class="n">Ces valeurs restent sur ton téléphone. Gmail exige aussi une connexion OAuth : la connexion sera ajoutée à l’étape suivante.</p>`;
  $('#gid').oninput=e=>st.set('gid',e.target.value);$('#gk').oninput=e=>st.set('gk',e.target.value);
  $('.grid').append(btn('▦','Aimantation : '+(snapOn?'oui':'non'),()=>{snapOn=!snapOn;st.set('snap',snapOn?'1':'0');tab('set')},snapOn))}}
const close=()=>$('#sheet').classList.remove('open');
async function saveB(n,b){const f=new File([b],n,{type:b.type});try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:n});return}}catch(e){if(e.name==='AbortError')return}
 const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;a.click();toast('Fichier exporté')}
const save=(n,t,m)=>saveB(n,new Blob([t],{type:m}));
document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{mode=b.dataset.m;document.querySelectorAll('.seg button').forEach(x=>x.classList.toggle('on',x===b));
 $('#c3').style.display=mode==='3d'?'block':'none';cv.style.display=mode==='3d'?'none':'block';close();dock();resize()});
dock();add('box');
</script></body></html>
